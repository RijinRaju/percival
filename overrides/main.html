{% extends "base.html" %}

{% block extrahead %}
{% if page %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Percival">
  <meta property="og:title" content="{{ page.meta.title or page.title }}">
  <meta property="og:description" content="{{ page.meta.description or config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
{% endif %}
{% endblock %}
