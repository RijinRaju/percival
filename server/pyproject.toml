[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "percival-server"
description = "Self-hosted control panel for Celery: live schedules, run history, stale-worker safety."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rijin Raju" }]
dependencies = [
    "percival",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "celery>=5.3",
    "celery-redbeat>=2.0",
    "redis>=4.5",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fakeredis>=2.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
percival-server = "percival_server.__main__:main"

[tool.hatch.version]
path = "percival_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["percival_server"]
# the built ui is gitignored, hatch would skip it without this
artifacts = ["percival_server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # fastapi's Depends() in defaults is the whole point

[tool.ruff.lint.isort]
known-first-party = ["percival", "percival_server"]

[tool.mypy]
python_version = "3.10"
packages = ["percival_server"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "redbeat.*"]
ignore_missing_imports = true
