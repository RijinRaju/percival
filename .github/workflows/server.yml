name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "client/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "client/**", ".github/workflows/server.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the server imports the client package for key names and schedule maths
      - run: pip install -e ../client -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
